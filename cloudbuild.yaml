steps:
  # ── Step 1: Install dependencies ─────────────────────────────────────────
  - id: 'install'
    name: 'node:20-slim'
    entrypoint: 'npm'
    args: ['install']

  # ── Step 2: Build Vite app → dist/ ───────────────────────────────────────
  - id: 'build'
    name: 'node:20-slim'
    entrypoint: 'npm'
    args: ['run', 'build']
    waitFor: ['install']

  # ── Step 3: Deploy to Firebase Hosting (branch-aware target) ─────────────
  # main         → hosting target "prd"     → edumoni-prd.web.app
  # feature/*    → hosting target "feature" → edumoni-feature.web.app
  - id: 'deploy'
    name: 'node:20-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        echo "$$FIREBASE_SA_KEY" > /tmp/firebase-sa.json
        npm install -g firebase-tools --quiet

        if [ "$BRANCH_NAME" = "main" ]; then
          DEPLOY_TARGET="prd"
          SITE_URL="https://edumoni-prd.web.app"
        else
          DEPLOY_TARGET="feature"
          SITE_URL="https://edumoni-feature.web.app"
        fi

        echo "Branch: $BRANCH_NAME → Target: $$DEPLOY_TARGET"
        GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json \
          firebase deploy --only hosting:$$DEPLOY_TARGET \
            --project edumoni \
            --non-interactive

        echo "$$SITE_URL" > /workspace/site-url.txt
        echo "Deployed to: $$SITE_URL"
    secretEnv: ['FIREBASE_SA_KEY']
    waitFor: ['build']

  # ── Step 4: Regression test against the deployed URL ─────────────────────
  - id: 'test'
    name: 'node:20-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        SITE_URL=$(cat /workspace/site-url.txt)
        echo "Running regression test against $$SITE_URL"
        npm run test:regression -- "$$SITE_URL"
    waitFor: ['deploy']

# ── Secret binding ────────────────────────────────────────────────────────────
availableSecrets:
  secretManager:
    - versionName: projects/edumoni/secrets/firebase-sa-key/versions/latest
      env: 'FIREBASE_SA_KEY'

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: 'ALLOW_LOOSE'
