steps:
  # ── Step 1: Install dependencies ─────────────────────────────────────────
  - id: 'install'
    name: 'node:20-slim'
    entrypoint: 'npm'
    args: ['install']

  # ── Step 2: Build Vite app → dist/ ───────────────────────────────────────
  - id: 'build'
    name: 'node:20-slim'
    entrypoint: 'npm'
    args: ['run', 'build']
    waitFor: ['install']

  # ── Step 3: Deploy to Firebase Hosting (branch-aware) ────────────────────
  - id: 'deploy'
    name: 'node:20-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        echo "$$FIREBASE_SA_KEY" > /tmp/firebase-sa.json
        npm install -g firebase-tools --quiet

        if [ "$BRANCH_NAME" = "main" ]; then
          FIREBASE_PROJECT="edumoni-prd"
          SITE_URL="https://edumoni-prd.web.app"
        else
          FIREBASE_PROJECT="edumoni-feature"
          SITE_URL="https://edumoni-feature.web.app"
        fi

        echo "Branch: $BRANCH_NAME → Project: $$FIREBASE_PROJECT"
        GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json \
          firebase deploy --only hosting \
            --project $$FIREBASE_PROJECT \
            --non-interactive

        echo "$$SITE_URL" > /workspace/site-url.txt
        echo "Deployed to: $$SITE_URL"
    secretEnv: ['FIREBASE_SA_KEY']
    waitFor: ['build']

  # ── Step 4: Regression test against the deployed URL ─────────────────────
  - id: 'test'
    name: 'node:20-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        SITE_URL=$(cat /workspace/site-url.txt)
        echo "Running regression test against $$SITE_URL"
        npm run test:regression -- "$$SITE_URL"
    waitFor: ['deploy']

# ── Secret binding ────────────────────────────────────────────────────────────
# Secret 存储在运行 Cloud Build 的 GCP 项目的 Secret Manager 中
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/firebase-sa-key/versions/latest
      env: 'FIREBASE_SA_KEY'

options:
  logging: CLOUD_LOGGING_ONLY
  # 加快构建：并发拉取镜像
  substitutionOption: 'ALLOW_LOOSE'
